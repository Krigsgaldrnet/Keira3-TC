name: Install dependencies
description: Set up Node.js and run npm ci, with the npm and Electron downloads cached
inputs:
  node-version:
    description: Node.js version
    required: true
  update-npm:
    description: Install the latest npm before npm ci
    default: 'false'
runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Update npm
      if: inputs.update-npm == 'true'
      shell: bash
      run: npm install -g npm@latest
    # npm ci downloads the Electron binary again on every run, and electron-builder its zips and tools
    - name: Cache Electron downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: electron-${{ runner.os }}-
    - name: npm ci
      shell: bash
      run: npm ci --include=optional
