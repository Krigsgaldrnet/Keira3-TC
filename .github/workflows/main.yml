name: main
on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

# A new push to a PR cancels its older runs. Pushes to master get a group of their own, so they never cancel or queue each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    name: lint-and-test
    steps:
      - uses: actions/checkout@v7
      - name: Fetch main branch
        if: github.ref != 'refs/heads/master'
        run: git rev-parse --verify master || git remote set-branches origin master && git fetch --depth 1 origin master && git branch master origin/master
      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: 24
      - name: Lint
        run: npm run lint
      - name: Unit and Integration tests
        uses: nick-invision/retry@v4
        with:
          max_attempts: 5
          # Coverage doesn't depend on the OS and slows the tests down, so the thresholds are enforced on one runner only
          command: npm run ${{ matrix.os == 'ubuntu-24.04' && 'test-ci:coverage' || 'test-ci' }}
          timeout_minutes: 20

  build:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        # PRs run one version per OS, master runs them all (ubuntu-22.04 stays for the older glibc, see #3844)
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-22.04", "ubuntu-24.04", "macos-15", "macos-26"]') }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-node-${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build
        run: npm run build:prod
      - name: Allow unprivileged user namespaces
        if: matrix.os == 'ubuntu-24.04'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-End tests
        uses: GabrielBB/xvfb-action@v1
        with:
          run: npm run e2e
