name: build-windows
on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

# A new push to a PR cancels its older runs. Pushes to master get a group of their own, so they never cancel or queue each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        # PRs run one version per OS, master runs them all
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-2025"]' || '["windows-2022", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-node-${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: ${{ matrix.node-version }}
      - name: electron:windows:ci
        run: npm run electron:windows:ci
